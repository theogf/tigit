[package]
name = "tigit"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
git2 = { version = "0.19", features = ["vendored-libgit2", "vendored-openssl"] }
anyhow = "1.0"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }
unicode-width = "0.2"
regex = "1.11"

[dev-dependencies]
tempfile = "3.15"
